<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Constellation — Genome Browser</title>
    <style>
      /* Palette inspired by the Aura theme by Dalton Menezes (MIT,
         https://github.com/daltonmenezes/aura-theme); accent selection
         informed by the Raycast port by Shubh Porwal. Values adapted
         for Constellation's elevation needs, not copied verbatim. See
         NOTICE.md at the repo root. */
      :root {
        --bg: #15141b;
        --bg-elev: #1c1a25;
        --bg-elev2: #252231;
        --fg: #edecee;
        --fg-dim: #adacae;
        --fg-mute: #6d6d6d;
        --accent: #a277ff;
        --accent-rgb: 162, 119, 255;
        --accent-soft: rgba(var(--accent-rgb), 0.15);
        --accent-alt: #61ffca;
        --accent-alt-rgb: 97, 255, 202;
        --border: #2d2b3a;
        --border-strong: #3b334b;
        --danger: #ff6767;
        --warn: #ffca85;
        --ok: #61ffca;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--fg);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      /* Everything inside #app is styled by the genome browser's own
         stylesheets (src/modalities/genome/genome.css and
         src/panels/panels.css), which travel with the widget so it looks
         the same here and in the dashboard. This page supplies only the
         palette and the full-height frame. */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main_genome.ts"></script>
  </body>
</html>
